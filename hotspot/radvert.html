<!doctype html>
<html lang="id">
<head>
    <meta http-equiv="refresh" content="2; url=$(link-orig)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="theme-color" content="#0b172a">
    <title>AUL.NET - Informasi</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        var popup = '';
        function openOrig() {
            if (window.focus) popup.focus();
            location.href = unescape('$(link-orig-esc)');
        }
        function openAd() {
            location.href = unescape('$(link-redirect-esc)');
        }
        function openAdvert() {
            if (window.name != 'hotspot_advert') {
                popup = open('$(link-redirect)', 'hotspot_advert', '');
                setTimeout(openOrig, 1000);
                return;
            }
            setTimeout(openAd, 1000);
        }
    </script>
</head>
<body onload="openAdvert()">
    <main class="state-shell">
        <section class="state-card enter" aria-labelledby="state-title">
            <a class="brand" href="$(link-status)" aria-label="AUL.NET status koneksi">
                <span class="brand-mark" aria-hidden="true"><span></span></span>
                <span>AUL.NET</span>
            </a>
            <div class="state-icon" aria-hidden="true">i</div>
            <div class="state-heading">
                <h1 id="state-title">Informasi jaringan</h1>
                <p>Halaman informasi akan terbuka otomatis.</p>
            </div>
            <div class="state-actions">
                <a class="primary-button" href="$(link-redirect)" target="hotspot_advert"><span>Buka informasi</span><span aria-hidden="true">&#8599;</span></a>
            </div>
        </section>
    </main>
</body>
</html>
