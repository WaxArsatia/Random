<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="theme-color" content="#0b172a">
    <title>AUL.NET - Keluar</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        function openLogin() {
            if (window.name != 'hotspot_logout') return true;
            open('$(link-login)', '_blank', '');
            window.close();
            return false;
        }
    </script>
</head>
<body>
    <main class="state-shell">
        <section class="state-card enter" aria-labelledby="state-title">
            <a class="brand" href="$(link-login)" aria-label="AUL.NET halaman login">
                <span class="brand-mark" aria-hidden="true"><span></span></span>
                <span>AUL.NET</span>
            </a>
            <div class="state-icon" aria-hidden="true">&#10003;</div>
            <div class="state-heading">
                <h1 id="state-title">Sesi telah berakhir</h1>
                <p>Terima kasih telah menggunakan jaringan AUL.NET.</p>
            </div>
            <dl class="stats">
                <div class="stat-row"><dt>Username</dt><dd>$(username)</dd></div>
                <div class="stat-row"><dt>Alamat IP</dt><dd>$(ip)</dd></div>
                <div class="stat-row"><dt>Alamat MAC</dt><dd>$(mac)</dd></div>
                <div class="stat-row"><dt>Durasi sesi</dt><dd>$(uptime)</dd></div>
                $(if session-time-left)
                <div class="stat-row"><dt>Sisa waktu</dt><dd>$(session-time-left)</dd></div>
                $(endif)
                <div class="stat-row"><dt>Data naik / turun</dt><dd>$(bytes-in-nice) / $(bytes-out-nice)</dd></div>
            </dl>
            <form class="state-actions" action="$(link-login)" name="login" onsubmit="return openLogin()">
                <button class="primary-button" type="submit"><span>Masuk kembali</span><span aria-hidden="true">&#8599;</span></button>
            </form>
        </section>
    </main>
</body>
</html>
