<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="theme-color" content="#0b172a">
    <title>AUL.NET - Gangguan koneksi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="state-shell">
        <section class="state-card enter" aria-labelledby="state-title">
            <a class="brand" href="$(link-login)" aria-label="AUL.NET halaman login">
                <span class="brand-mark" aria-hidden="true"><span></span></span>
                <span>AUL.NET</span>
            </a>
            <div class="state-icon is-danger" aria-hidden="true">!</div>
            <div class="state-heading">
                <h1 id="state-title">Koneksi mengalami kendala</h1>
                <p>$(error)</p>
            </div>
            <div class="state-actions">
                <a class="primary-button" href="$(link-login)"><span>Kembali ke login</span><span aria-hidden="true">&#8599;</span></a>
            </div>
        </section>
    </main>
</body>
</html>
